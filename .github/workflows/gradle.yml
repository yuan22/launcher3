name: Java CI with Gradle and APK Release

on:
  push:
    tags: # 当打 tag 时触发（例如 v1.0.0）
      - 'v*' # 匹配 v 开头的 tag，如 v1.0.0
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要权限来上传 Release

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle 5.1.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '5.1.1'

    - name: Build APK
      run: gradle build # 或 ./gradlew assembleRelease（如果用 wrapper）

    - name: Find APK
      id: find-apk
      run: |
        APK_PATH=$(find . -name "*.apk" | head -1)
        echo "APK Path: $APK_PATH"
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create-release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自动使用 GitHub Token
        CURRENT_DATE: ${{ format('{0}{1}{2}', github.run_date[0:4], github.run_date[5:7], github.run_date[8:10]) }}
      with:
        tag_name: dev-${{ env.CURRENT_DATE }}  # 例如 dev-20240419
        release_name: Release dev-${{ env.CURRENT_DATE }}
        draft: false
        prerelease: false

    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.find-apk.outputs.apk_path }}
        asset_name: app-release.apk # 自定义 APK 名称
        asset_content_type: application/vnd.android.package-archive
